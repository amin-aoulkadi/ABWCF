#
# Uses sbt to run unit tests.
#

name: Unit Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin # Eclipse Temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - shell: bash
        run: sbt +test
